[project]
name = "anki-mcp"
version = "0.2.0"
description = "Review Anki cards by chatting with an AI agent, via MCP, backed by the official anki library synced with AnkiWeb."
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
    "anki>=26.8",
    "fastmcp>=3.0",
    "httpx>=0.28.1",
    "pillow>=12.3.0",
    "uvicorn>=0.30",
    "zstandard>=0.25.0",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["anki_mcp"]

[tool.ruff]
line-length = 110
extend-exclude = ["scripts/ankiweb_probe.py"]  # investigation-era probe, kept as-is
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
